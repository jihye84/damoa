<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다모아</title>
<meta name="description" content="반 아이들의 생각을 한 화면에 다 모아요">
<script src="js/inapp.js?v=202611071223"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .hero { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; text-align: center; }
  .hero .logo { font-size: clamp(56px, 12vh, 96px); }
  .hero p { margin: 0; font-size: clamp(18px, 3vh, 24px); color: var(--ink-2); line-height: 1.5; }
  .choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .choice { width: 260px; padding: 24px; border-radius: 20px; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .choice:hover { border-color: var(--teal); }
  .choice b { font-size: 22px; }
  .choice span { font-size: 15px; color: var(--ink-3); }
  .choice.kid { background: var(--teal); color: #fff; border-color: var(--teal); }
  .choice.kid span { color: #E7F3F1; }
</style>
</head>
<body>
  <main class="hero">
    <div class="logo">다모아</div>
    <p>반 아이들의 생각을<br>한 화면에 다 모아요</p>
    <div class="choices">
      <a class="choice" href="teacher.html"><b>선생님</b><span>로그인하고 수업 열기</span></a>
      <a class="choice kid" href="join.html"><b>학생</b><span>입장 번호로 들어가기</span></a>
    </div>
  </main>
