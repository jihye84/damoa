<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF6F4">
<title>다모아 · 학생</title>
<script src="js/inapp.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/student.css">
</head>
<body class="kid">
<div class="app">

  <!-- 입장 번호 넣기 (QR 없이 들어왔을 때) -->
  <section id="v-code" class="screen center" hidden>
    <div class="logo big">다모아</div>
    <form id="code-form" class="code-form">
      <label for="code-input" class="kid-title">입장 번호를 넣어요</label>
      <input id="code-input" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-describedby="code-help">
      <div id="code-help" class="muted">선생님 화면에 있는 6자리 숫자예요</div>
      <button type="submit" class="kid-btn">들어가기</button>
    </form>
  </section>

  <!-- 이름 고르기 -->
  <section id="v-names" class="screen" hidden>
    <div class="row kid-head">
      <div class="logo">다모아</div>
      <div id="names-title" class="pill"></div>
    </div>
    <h1 class="kid-title center-text">내 이름을 눌러요</h1>
    <div id="names-grid" class="names-grid grow"></div>
    <p class="names-help">회색 이름은 이미 친구가 들어왔어요. 내 이름이 회색이면 선생님께 말해요.</p>
  </section>

  <!-- 기다리기 -->
  <section id="v-wait" class="screen center wait" hidden>
    <div class="welcome-check" aria-hidden="true">
      <svg width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 class="welcome-title">들어왔어요!</h1>
    <div id="wait-name" class="welcome-name"></div>
    <div class="wait-msg">
      <span>선생님이 문제를 보낼 때까지</span>
      <span>기다려요</span>
    </div>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <button id="not-me" type="button" class="link-btn">내 이름이 아니에요</button>
  </section>

  <!-- 풀기 -->
  <section id="v-work" class="screen work" hidden>
    <nav class="tools" aria-label="필기 도구">
      <button type="button" class="tool on" data-tool="pen" aria-label="펜" aria-pressed="true">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button type="button" class="tool" data-tool="eraser" aria-label="지우개" aria-pressed="false">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-5-5 10-10 8 8-6 6"/><path d="M6 12l6 6"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button type="button" class="swatch on" data-color="#1D4ED8" aria-label="파란색" aria-pressed="true" style="background:#1D4ED8"></button>
      <button type="button" class="swatch" data-color="#DC2626" aria-label="빨간색" aria-pressed="false" style="background:#DC2626"></button>
      <button type="button" class="swatch" data-color="#1F2430" aria-label="검은색" aria-pressed="false" style="background:#1F2430"></button>
      <div class="spacer"></div>
      <button type="button" id="undo" class="tool" aria-label="되돌리기">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      </button>
    </nav>
    <div class="work-main">
      <div class="row work-head">
        <div class="logo small">다모아</div>
        <div id="work-name" class="pill white"></div>
        <div class="spacer"></div>
        <div id="sent-badge" class="sent-badge" hidden>보냈어요! 고쳐서 다시 보내도 돼요</div>
      </div>
      <div id="sheet-host" class="grow sheet-host"></div>
      <div class="row work-foot">
        <span class="muted foot-help">펜으로 쓰고, 손가락으로 골라요</span>
        <div class="spacer"></div>
        <button id="send" type="button" class="kid-btn send">
          전송
          <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- 겹쳐 뜨는 화면들 -->
  <div id="ov-front" class="overlay front" hidden>
    <svg role="img" aria-label="앞을 바라보는 두 눈" width="300" height="142" viewBox="0 0 360 170">
      <ellipse cx="90" cy="85" rx="78" ry="74" fill="#fff" stroke="#1F2430" stroke-width="8"/>
      <ellipse cx="270" cy="85" rx="78" ry="74" fill="#fff" stroke="#1F2430" stroke-width="8"/>
      <circle cx="96" cy="66" r="32" fill="#1F2430"/><circle cx="276" cy="66" r="32" fill="#1F2430"/>
      <circle cx="106" cy="54" r="10" fill="#fff"/><circle cx="286" cy="54" r="10" fill="#fff"/>
    </svg>
    <div class="ov-big">모두 앞을 보세요</div>
    <div class="ov-sub">선생님 이야기가 끝나면<br>하던 것을 이어서 할 수 있어요</div>
  </div>

  <div id="ov-lock" class="overlay lock" hidden>
    <div class="lock-ring">
      <svg role="img" aria-label="자물쇠" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <div class="ov-big">잠깐 쉬어요</div>
    <div class="ov-sub">선생님이 화면을 잠갔어요.<br>펜을 내려놓고 기다려요.</div>
  </div>

  <div id="ov-feedback" class="overlay feedback" hidden>
    <div class="fb-title">선생님이 도장을 찍어 주셨어요!</div>
    <div class="fb-body">
      <div id="fb-stamp" class="fb-stamp"></div>
      <div id="fb-comment" class="fb-comment" hidden></div>
    </div>
    <button id="fb-ok" type="button" class="kid-btn">확인했어요</button>
  </div>

  <div id="ov-ended" class="overlay ended" hidden>
    <div class="ov-big">수업이 끝났어요</div>
    <div class="ov-sub">오늘도 수고했어요!</div>
  </div>

  <div id="ov-rotate" class="overlay rotate">
    <div class="ov-big">태블릿을 옆으로<br>눕혀 주세요</div>
  </div>

  <div id="ov-loading" class="overlay loading">
    <div class="dots" aria-label="불러오는 중"><span></span><span></span><span></span></div>
  </div>
</div>
<script type="module" src="js/student.js"></script>
</body>
</html>
